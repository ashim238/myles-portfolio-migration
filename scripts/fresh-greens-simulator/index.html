<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fresh Greens on iOS</title>
    <link rel="stylesheet" href="/screen.css">
    <script defer src="/screen.js"></script>
  </head>
  <body>
    <main id="device" aria-label="Fresh Greens iPhone simulator">
      <img id="screen" tabindex="0" draggable="false" alt="Live Fresh Greens iOS screen. Tap a control, drag to scroll, or type into a selected field." aria-describedby="instructions">
      <p id="instructions">Tap the app to interact. After selecting a search field, type a place name or use the iPhone keyboard.</p>
      <p id="status" role="status">Connecting to Fresh Greens…</p>
    </main>
  </body>
</html>
