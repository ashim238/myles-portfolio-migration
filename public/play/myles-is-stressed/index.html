<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MYLES IS STRESSED</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <main class="app-shell" data-embed-content>
      <header class="panel">
        <h1>MYLES IS STRESSED</h1>
        <p>
          A game sketch where everyday stressors chase me around in a maze.
        </p>
        <ul class="instructions" aria-label="Game instructions">
          <li>Press <kbd>Space</kbd> to start.</li>
          <li>Use arrow keys to move.</li>
          <li>Collect 7th Street Burgers, avoid stressors, and use Super Saiyan, clone, or magnet power-ups.</li>
        </ul>
      </header>
      <section class="panel status-panel">
        <p id="game-status" aria-live="polite">Ready to start.</p>
      </section>
      <section class="panel canvas-wrap">
        <div id="game-canvas" role="img" aria-label="MYLES IS STRESSED gameplay canvas"></div>
      </section>
    </main>
    <script src="embed-bridge.js"></script>
    <script src="sketch.js?v=character-polish"></script>
  </body>
</html>
