name: Verify Reader evidence grammar

on:
  push:
    branches:
      - codex/reader-evidence-grammar
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-reader-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, typecheck, content, and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check "pypdf>=5,<7"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript
        run: npx tsc --noEmit

      - name: Validate content
        run: npm run validate:content

      - name: Build production app
        run: npm run build

      - name: Verify Reader route assets
        run: node scripts/verify-reader-performance.mjs

      - name: Capture whitespace report
        id: whitespace
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          base="$(git merge-base origin/main HEAD)"
          {
            git diff --check
            git diff --check "$base"..HEAD
          } 2>&1 | tee .next/reader-whitespace-report.txt

      - name: Upload Reader verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-verification-reports
          if-no-files-found: error
          path: |
            .next/reader-performance-report.json
            .next/reader-whitespace-report.txt

      - name: Enforce whitespace
        if: steps.whitespace.outcome == 'failure'
        run: exit 1
