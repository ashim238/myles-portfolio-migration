name: Capture Myles 98 visual review

on:
  push:
    branches:
      - tmp/m98-visual-capture-20260808
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-myles-98-visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VISUAL_REVIEW_BASE_URL: http://127.0.0.1:3000
      VISUAL_REVIEW_OUTPUT: visual-review
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright for the capture runner
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Build the exact review commit
        run: npm run build

      - name: Start the production app
        shell: bash
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/myles-98-review-server.log 2>&1 &
          echo $! > /tmp/myles-98-review-server.pid

      - name: Capture the visual review matrix
        run: node scripts/capture-visual-review.mjs

      - name: Upload visual review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myles-98-local-visual-review-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: visual-review

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/myles-98-review-server.log || true
