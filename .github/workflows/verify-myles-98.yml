name: Verify Myles 98

on:
  push:
    branches:
      - codex/myles-97-design
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-myles-98-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, typecheck, content, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript
        run: npx tsc --noEmit

      - name: Validate content
        run: npm run validate:content

      - name: Build production app
        run: npm run build

      - name: Check branch diff whitespace
        shell: bash
        run: |
          base="$(git merge-base origin/main HEAD)"
          git diff --check "$base"..HEAD
