name: Verify Myles 98

on:
  push:
    branches:
      - codex/myles-97-design
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-myles-98-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, typecheck, content, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean dependency install
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript
        run: npx tsc --noEmit

      - name: Validate content
        run: npm run validate:content

      - name: Build production app
        run: npm run build

      - name: Check whitespace
        shell: bash
        run: |
          git diff --check
          base="$(git merge-base origin/main HEAD)"
          git diff --check "$base"..HEAD

      - name: Upload regenerated package lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
