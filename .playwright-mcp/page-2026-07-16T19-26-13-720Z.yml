        - generic [ref=f20e96]: Creative Strategist Intern · 2021
      - heading "TikTok Dynamic Showcase Ads" [level=1] [ref=f20e97]
      - paragraph [ref=f20e98]: During my 2021 internship with Global Creative Lab, I designed three static catalog templates for TikTok's Dynamic Showcase Ads. The product slot stayed fixed while the type, color, and supporting graphics changed.
    - region "At a glance" [ref=f20e99]:
      - generic [ref=f20e100]:
        - generic [ref=f20e101]:
          - term [ref=f20e102]: Problem
          - definition [ref=f20e103]: Dynamic Showcase Ads gave brands pre-made catalog templates. GCL needed a launch batch that could cover several fashion subcultures and still look at home on TikTok.
        - generic [ref=f20e104]:
          - term [ref=f20e105]: Role
          - definition [ref=f20e106]: Creative Strategist Intern
        - generic [ref=f20e107]:
          - term [ref=f20e108]: Contribution
          - definition [ref=f20e109]: Designed three of roughly ten templates in TikTok's Dynamic Showcase Ads launch batch.
        - generic [ref=f20e110]:
          - term [ref=f20e111]: Team
          - definition [ref=f20e112]: Global Creative Lab
        - generic [ref=f20e113]:
          - term [ref=f20e114]: Feedback
          - definition [ref=f20e115]: GCL encouraged me to keep exploring the templates as modular parts and pushed each direction closer to TikTok's existing brand language.
        - generic [ref=f20e116]:
          - term [ref=f20e117]: Timeline
          - definition [ref=f20e118]: May – August 2021
        - generic [ref=f20e119]:
          - term [ref=f20e120]: Tools
          - definition [ref=f20e121]: Photoshop, Illustrator
        - generic [ref=f20e122]:
          - term [ref=f20e123]: Outcome
