          - region [ref=f3e144]:
            - heading "Platform audits and resident research" [level=3] [ref=f3e145]
            - generic [ref=f3e146]:
              - paragraph [ref=f3e147]: I collected 14 resident and stakeholder responses, including two local businesses. The sample informed this concept. It doesn't stand in for all NYC residents.
              - paragraph [ref=f3e148]: The team audited six travel platforms. I evaluated Airbnb with Kaori Ogawa and Amy Zhang against Nielsen's ten usability heuristics. The evaluation surfaced issues with label consistency, family-facing filters, and visual clutter.
            - list [ref=f3e149]:
              - listitem [ref=f3e150]:
                - heading "Guest Favorite label overuse" [level=3] [ref=f3e151]
                - paragraph [ref=f3e152]: The designation appeared on nearly every listing we reviewed, with no consistent criteria visible to the evaluator, eroding trust in a signal meant to shortcut decisions.
              - listitem [ref=f3e153]:
                - heading "Minimal family & accessibility filters" [level=3] [ref=f3e154]
                - paragraph [ref=f3e155]: Kid-friendly and accessibility-specific filters were thin. A crib amenity was often the only family-facing signal, leaving group planners without meaningful constraints.
              - listitem [ref=f3e156]:
                - heading "Visual clutter and repetitive listings" [level=3] [ref=f3e157]
                - paragraph [ref=f3e158]: Grid layouts offered minimal differentiation between stays. Similar photography and copy patterns created decision fatigue before a traveler could compare neighborhood context.
          - generic [ref=f3e159]:
            - paragraph [ref=f3e160]: Two concerns appeared most often in the resident and stakeholder survey.
            - generic [ref=f3e161]:
              - paragraph [ref=f3e162]: 10 of 14 responses (71%) named overcrowding and over-tourism. 7 of 14 (50%) named a lack of authentic experiences.
              - paragraph [ref=f3e163]: "Highlights from 14 responses, including 2 local businesses: Reimagining NYC Tourism: A More Meaningful & Sustainable Experience (resident and stakeholder survey)."
