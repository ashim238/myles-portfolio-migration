          - generic [ref=f3e95]:
            - paragraph [ref=f3e96]: The early team concept could move a visitor to another neighborhood, but it didn't change how they engaged after arriving.
            - generic [ref=f3e97]:
              - paragraph [ref=f3e98]: The team used a Manhattan heatmap as an exploratory hypothesis to test whether redirecting visitors could distribute attention across more neighborhoods.
              - paragraph [ref=f3e99]: That first artifact made movement on the map the outcome. The survey became the next step.
          - region [ref=f3e100]:
            - 'heading "The first prototype: a Manhattan heatmap" [level=3] [ref=f3e101]'
