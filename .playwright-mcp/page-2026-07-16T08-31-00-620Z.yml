          - definition [ref=f2e111]: Global Creative Lab
        - generic [ref=f2e112]:
          - term [ref=f2e113]: Feedback
          - definition [ref=f2e114]: GCL encouraged the modular direction and helped me bring each template closer to TikTok's visual language.
        - generic [ref=f2e115]:
