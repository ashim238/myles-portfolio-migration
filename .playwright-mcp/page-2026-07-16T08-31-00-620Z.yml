      - heading "TikTok Dynamic Showcase Ads" [level=1] [ref=f2e96]
      - paragraph [ref=f2e97]: During my 2021 internship with Global Creative Lab, I designed three static templates for TikTok's Dynamic Showcase Ads. Each gave a different fashion subculture its own visual language while keeping the same catalog structure.
    - region "At a glance" [ref=f2e98]:
      - generic [ref=f2e99]:
        - generic [ref=f2e100]:
          - term [ref=f2e101]: Problem
          - definition [ref=f2e102]: Pre-made catalog templates needed enough visual range to speak to different fashion tastes without losing TikTok's identity.
        - generic [ref=f2e103]:
          - term [ref=f2e104]: Role
          - definition [ref=f2e105]: Creative Strategist Intern
        - generic [ref=f2e106]:
          - term [ref=f2e107]: Contribution
