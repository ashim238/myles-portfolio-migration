        - heading "Rebuilding the system in Mailchimp" [level=2] [ref=f2e283]
        - generic [ref=f2e288]:
          - generic [ref=f2e289]:
            - paragraph [ref=f2e290]: I rebuilt the live system in Mailchimp so the founder could edit it without touching HTML. Matching the Figma spacing in the builder added too many containers and wrappers. Test sends showed which wrappers and dividers could go.
            - paragraph [ref=f2e291]:
              - mark [ref=f2e292]: Gmail's 102 KB HTML clipping threshold set a rigid constraint.
              - text: To reduce the HTML Gmail measures, I flattened the hierarchy, removed wrappers and blocks that didn't need to ship, and used Mailchimp-native structure where it replaced custom markup.
            - paragraph [ref=f2e293]: I handled the image files separately. Compressing the PNGs through an external tool lowered their download weight. It didn't reduce the HTML source Gmail measures. For dark-mode-friendly dividers, I removed backgrounds in Photoshop so they wouldn't look muddy on phones.
            - paragraph [ref=f2e294]: The weekly kit used fewer custom assets and more Mailchimp-native structure. The counselor toolkit needed more image work and tighter file discipline for its duotone icons. I kept the closest Mailchimp sans to Saans and the full brand palette. Those choices kept the email close to the site and reflected the founder's preference for vibrant color.
          - generic [ref=f2e295]:
            - 'figure "Figma: students block (design source)" [ref=f2e296]':
              - 'button "Expand image: Figma: students block with layout guides, spacing rails, and type hierarchy." [ref=f2e297]':
