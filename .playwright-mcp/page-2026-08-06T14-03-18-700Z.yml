        - heading "What 120 newsletters revealed" [level=2] [ref=f2e131]
        - generic [ref=f2e137]:
          - paragraph [ref=f2e138]: One collaborator and I worked together to compile and evaluate more than 120 newsletter examples. We compared clarity, personalization, tone of voice, visual appeal, and branding consistency.
          - paragraph [ref=f2e139]: We looked most closely at Revenews, The 74, Next by Jeff Selingo, Medium, and Folderly as references for scanning, hierarchy, tone, and brand structure.
          - list "Audit findings and system rules" [ref=f2e140]:
            - listitem [ref=f2e141]:
              - paragraph [ref=f2e142]:
                - strong [ref=f2e143]: "Finding:"
                - text: Long sends needed stronger scanning cues.
              - paragraph [ref=f2e144]:
                - strong [ref=f2e145]: "System rule:"
                - text: Action-focused section titles, selective emphasis, and clearer breaks.
            - listitem [ref=f2e146]:
              - paragraph [ref=f2e147]:
                - strong [ref=f2e148]: "Finding:"
                - text: Weekly content changed while the brand structure should not.
              - paragraph [ref=f2e149]:
                - strong [ref=f2e150]: "System rule:"
                - text: Locked spacing, type, dividers, and section order with swappable copy and imagery.
            - listitem [ref=f2e151]:
              - paragraph [ref=f2e152]:
                - strong [ref=f2e153]: "Finding:"
                - text: The founder assembled every issue.
              - paragraph [ref=f2e154]:
                - strong [ref=f2e155]: "System rule:"
                - text: A Mailchimp-native kit that can be edited without touching HTML.
            - listitem [ref=f2e156]:
              - paragraph [ref=f2e157]:
                - strong [ref=f2e158]: "Finding:"
                - text: Gmail clips large HTML emails.
              - paragraph [ref=f2e159]:
                - strong [ref=f2e160]: "System rule:"
                - text: Flatter hierarchy, fewer wrappers and blocks, and selective native components.
            - listitem [ref=f2e161]:
              - paragraph [ref=f2e162]:
                - strong [ref=f2e163]: "Finding:"
                - text: Different send purposes need different density.
              - paragraph [ref=f2e164]:
                - strong [ref=f2e165]: "System rule:"
                - text: Welcome, weekly, and short event templates built from the same rules.
