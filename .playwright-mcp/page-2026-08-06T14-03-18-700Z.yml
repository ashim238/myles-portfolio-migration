        - generic [ref=f2e314]:
          - paragraph [ref=f2e315]: I shipped a master template, modular blocks, locked-versus-swappable rules, and three template variants.
          - paragraph [ref=f2e316]: The founder now assembles each send from the Mailchimp-native kit without editing HTML.
          - paragraph [ref=f2e317]: The first redesigned send went out November 4, 2025. Mailchimp reported an observed ~52.6% open rate with MPP excluded, while earlier sends were around 30%. That result is supporting context, not a controlled attribution test. I don't claim the redesign caused the change.
