        - heading "A rebrand and a weekly workflow" [level=2] [ref=f2e93]
        - paragraph [ref=f2e100]: UnderstandingFAFSA helps students, parents, and counselors navigate the Free Application for Federal Student Aid (FAFSA). The newsletter carries guidance for all three groups. The website had already adopted Saans and a refreshed palette. The scope was email-only, and the founder assembles every issue.
        - region [ref=f2e101]:
          - heading "Where the old template broke down" [level=3] [ref=f2e102]
          - paragraph [ref=f2e104]: "The newsletter covers deadline-driven guidance at key checkpoints: FAFSA filing windows, scholarship deadlines, and policy changes. The old template had uneven CTAs, long stretches of text, weak section breaks, and a layout that wasn't optimized for mobile. Its muted palette also came from the site's previous visual system."
          - generic "Newsletter mobile layouts and reported open rates" [ref=f2e105]:
            - figure "Prior sends · around 30% open rate" [ref=f2e106]:
              - region "Prior sends · around 30% open rate. Scrollable full newsletter." [ref=f2e110]:
                - img "Old newsletter template on mobile before the redesign, full scroll." [ref=f2e111]
              - paragraph [ref=f2e113]: Scroll inside the frame to read the full send.
              - link "Open original prior newsletter capture" [ref=f2e114]:
                - /url: /projects/understandingfafsa/mobile-before.jpg
                - text: Open original capture
                - generic [ref=f2e115]: ↗
            - figure "First redesigned send · ~52.6% open rate (MPP excluded)" [ref=f2e116]:
              - region "First redesigned send · ~52.6% open rate (MPP excluded). Scrollable full newsletter." [ref=f2e120]:
