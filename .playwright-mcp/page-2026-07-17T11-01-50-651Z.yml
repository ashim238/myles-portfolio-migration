      - region [ref=f2e161]:
        - heading "Why time and distance were not enough" [level=2] [ref=f2e162]
        - blockquote [ref=f2e163]: “ The Green Book collected community knowledge about where Black travelers could safely stop.
        - paragraph [ref=f2e165]: "In interviews, Black drivers described routes in terms of more than time and distance: whether roads are lit, whether a town feels safe to stop in, and where police tend to sit. Navigation apps don't account for those signals. Fresh Greens brings them into route selection."
      - region [ref=f2e166]:
        - heading "What six interviews changed" [level=2] [ref=f2e167]
        - paragraph [ref=f2e168]: "Six interviews with Black drivers across the Southern US, anonymized in synthesis and led with joy and fear before any product questions. The timeline was tight, so the synthesis stayed lean: I pulled the recurring trends into four routing markers."
        - figure "Thesis · Fresh Greens, 2026" [ref=f2e169]:
          - blockquote [ref=f2e170]: Moments of joy and fear have a lasting effect on how Black drivers interpret the spaces they inhabit. They stick.
