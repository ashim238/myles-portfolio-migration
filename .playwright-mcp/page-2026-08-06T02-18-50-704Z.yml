          - heading "Why route planning needs more than time and distance" [level=2] [ref=f5e90]
          - generic [ref=f5e96]:
            - paragraph [ref=f5e97]: I grew up in Brooklyn and moved to rural South Jersey around age ten. Confederate flags on front lawns made night driving feel exposing. I worried about a police stop or car trouble in a place where asking for help might not feel safe.
            - paragraph [ref=f5e98]: I still used Google Maps or Apple Maps, then carried the rest myself. At night, I avoided backroads, drove comfortably below the speed limit, kept my wallet within reach, and watched the road around me. That experience gave me a hypothesis, not proof. I interviewed six Black drivers to see what carried beyond my own route.
            - paragraph [ref=f5e99]:
              - text: The Green Book used print to help Black travelers find places that would serve them. I use that history as design lineage, not evidence that Fresh Greens is its digital successor. I wanted to see what that principle could mean inside navigation.
              - 'link "Source: Smithsonian National Museum of African American History and Culture (opens in a new tab)" [ref=f5e100] [cursor=pointer]':
                - /url: https://nmaahc.si.edu/explore/stories/traveling-through-jim-crow-america
                - text: "Source: Smithsonian National Museum of African American History and Culture"
                - generic [ref=f5e101]: (opens in a new tab)
              - text: .
