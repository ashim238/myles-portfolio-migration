          - generic [ref=f5e134]:
            - generic [ref=f5e135]:
              - paragraph [ref=f5e136]: Participants timed trips around daylight, avoided roads, and compared clues outside maps that only optimized time and distance.
              - paragraph [ref=f5e137]: I moved from a Google Maps feature to a standalone route preview, then turned public and community inputs into route chips and source cards. The prototype can explain why it prefers one route. It doesn't prove that route is safer.
