          - heading "Three problems the interviews made clear" [level=2] [ref=f5e106]
          - generic [ref=f5e111]:
            - paragraph [ref=f5e112]: Participants already knew how to plan, prepare, and decide whom to trust. Their answers widened my hypothesis into three problems.
            - generic "Three Fresh Greens product problems" [ref=f5e113]:
              - generic [ref=f5e114]:
                - paragraph [ref=f5e115]: Plan
                - paragraph [ref=f5e116]: Drivers couldn't inspect conditions on each route before choosing. 6 of 6 connected trip timing to daylight, 5 of 6 raised road conditions, 5 of 6 raised police presence, and 3 of 6 raised wildlife.
              - generic [ref=f5e117]:
                - paragraph [ref=f5e118]: Respond
                - paragraph [ref=f5e119]: Participants described preparing for police encounters and keeping help close when unexpected problems raised stress.
              - generic [ref=f5e120]:
                - paragraph [ref=f5e121]: Trust
                - paragraph [ref=f5e122]: Useful community knowledge lived outside navigation and depended on reaching the right person. 5 of 6 asked family or friends before trusting an unfamiliar place.
            - paragraph [ref=f5e124]: These interviews widened my hypothesis. They don't represent every Black driver.
        - region [ref=f5e125]:
