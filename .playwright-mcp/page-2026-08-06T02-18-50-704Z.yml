          - heading "3. Navigate with transparent community contributors" [level=2] [ref=f5e264]
          - generic [ref=f5e269]:
            - generic [ref=f5e270]:
              - paragraph [ref=f5e271]: Public datasets still matter because their source and scope can be inspected, but they can't describe how a place felt to someone who moved through it. I kept each firsthand account specific instead of treating it as fact.
              - paragraph [ref=f5e272]: The intended trust model keeps every firsthand account visible as one person's account unless human review hides or removes it for violating contribution rules. Similar reports from separate community contributors across time gain more influence in ranking. A time-sensitive hazard can surface sooner when waiting would make it useless. Sparse coverage stays labeled as uncertainty, never as a positive safety signal.
              - paragraph [ref=f5e273]:
                - strong [ref=f5e274]: "Current prototype limit:"
                - text: the prototype maps one report to one scored zone, so a single report can affect route ranking now. Corroboration-weighted ranking is an intended safeguard, not a built feature. The screens don't yet show visible contributor provenance or differentiated trust levels.
            - figure "Structured tags keep each account specific while leaving room for context." [ref=f5e275]:
