        - generic [ref=f6e82]: Creative Strategist Intern · 2021
      - heading "TikTok Dynamic Showcase Ads" [level=1] [ref=f6e83]
      - paragraph [ref=f6e84]: During my 2021 internship with Global Creative Lab, I designed three static catalog templates for TikTok's Dynamic Showcase Ads. The product slot stayed fixed while the type, color, and supporting graphics changed.
    - region "At a glance" [ref=f6e85]:
      - generic [ref=f6e86]:
        - generic [ref=f6e87]:
          - term [ref=f6e88]: Problem
          - definition [ref=f6e89]: Dynamic Showcase Ads gave brands pre-made catalog templates. GCL needed a launch batch that could cover several fashion subcultures and still look at home on TikTok.
        - generic [ref=f6e90]:
          - term [ref=f6e91]: Role
          - definition [ref=f6e92]: Creative Strategist Intern
        - generic [ref=f6e93]:
          - term [ref=f6e94]: Contribution
          - definition [ref=f6e95]: Designed three of roughly ten templates in TikTok's Dynamic Showcase Ads launch batch.
        - generic [ref=f6e96]:
          - term [ref=f6e97]: Team
          - definition [ref=f6e98]: Global Creative Lab
        - generic [ref=f6e99]:
          - term [ref=f6e100]: Feedback
          - definition [ref=f6e101]: GCL encouraged me to keep exploring the templates as modular parts and pushed each direction closer to TikTok's existing brand language.
        - generic [ref=f6e102]:
          - term [ref=f6e103]: Timeline
          - definition [ref=f6e104]: May – August 2021
        - generic [ref=f6e105]:
          - term [ref=f6e106]: Tools
          - definition [ref=f6e107]: Photoshop, Illustrator
        - generic [ref=f6e108]:
          - term [ref=f6e109]: Outcome
          - definition [ref=f6e110]:
            - generic [ref=f6e111]: "1"
            - text: of 3 templates shipped in the launch library
      - generic [ref=f6e112]:
        - paragraph [ref=f6e113]: Key moves
        - list [ref=f6e114]:
          - listitem [ref=f6e115]: → Studied Y2K, Maximalism, Dark Academia, WitchTok, and Cottagecore before choosing the final directions.
          - listitem [ref=f6e116]: → Used one product slot map across Dopamine Dressing, e-Boy/e-Girl, and Light Academia.
          - listitem [ref=f6e117]: → Built the files in parts and tested which elements could mix across directions.
    - region [ref=f6e118]:
      - heading "Choosing the visual directions" [level=2] [ref=f6e119]
      - paragraph [ref=f6e121]: Before I moved into mockups, I looked at Y2K, Maximalism, Dark Academia, WitchTok, and Cottagecore. Those references helped me compare how different parts of TikTok's fashion community used type, color, texture, and imagery. I moved forward with Dopamine Dressing, e-Boy/e-Girl, and Light Academia because the differences were obvious at a glance.
    - region [ref=f6e122]:
      - heading "The catalog structure stayed fixed" [level=2] [ref=f6e123]
      - paragraph [ref=f6e125]: Brands added their product catalog to a pre-made template. I handed off layered Photoshop files with a slot map showing where each asset would go.
