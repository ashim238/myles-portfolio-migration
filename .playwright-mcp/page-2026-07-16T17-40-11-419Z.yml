    - region [ref=f4e176]:
      - heading "Auditing the category and checking the idea with residents" [level=2] [ref=f4e177]
      - generic [ref=f4e178]:
        - paragraph [ref=f4e179]: The team audited six travel platforms. I evaluated Airbnb with Kaori Ogawa and Amy Zhang against Nielsen's ten usability heuristics. The evaluation surfaced issues with label consistency, family-facing filters, and visual clutter.
        - paragraph [ref=f4e180]: The resident survey produced 14 responses. That dataset is the source for the two survey findings shown below.
        - paragraph [ref=f4e181]: The next concept direction focused on neighborhood context and participation instead.
      - list [ref=f4e182]:
        - listitem [ref=f4e183]:
          - heading "Guest Favorite label overuse" [level=3] [ref=f4e184]
          - paragraph [ref=f4e185]: The designation appeared on nearly every listing we reviewed, with no consistent criteria visible to the evaluator, eroding trust in a signal meant to shortcut decisions.
        - listitem [ref=f4e186]:
          - heading "Minimal family & accessibility filters" [level=3] [ref=f4e187]
          - paragraph [ref=f4e188]: Kid-friendly and accessibility-specific filters were thin. A crib amenity was often the only family-facing signal, leaving group planners without meaningful constraints.
        - listitem [ref=f4e189]:
          - heading "Visual clutter and repetitive listings" [level=3] [ref=f4e190]
          - paragraph [ref=f4e191]: Grid layouts offered minimal differentiation between stays. Similar photography and copy patterns created decision fatigue before a traveler could compare neighborhood context.
    - region [ref=f4e192]:
      - heading "What the data said" [level=2] [ref=f4e193]
      - paragraph [ref=f4e194]: Two concerns appeared most often in the 14-response resident survey.
      - generic [ref=f4e195]:
        - paragraph [ref=f4e196]: Of the 14 responses, 71% were concerned about overcrowding and over-tourism. Another 50% were concerned about a lack of authentic experiences.
        - paragraph [ref=f4e197]: "Highlights from 14 survey responses: Reimagining NYC Tourism: A More Meaningful & Sustainable Experience (resident survey)."
      - generic "Survey response highlights" [ref=f4e198]:
        - figure "concerned about overcrowding and over-tourism" [ref=f4e199]:
          - generic: 71%
        - figure "concerned about lack of authentic experiences" [ref=f4e204]:
          - generic: 50%
    - region [ref=f4e209]:
      - heading "From research to framework" [level=2] [ref=f4e210]
      - paragraph [ref=f4e211]: The concept used three personas and a Learn, Plan, Go structure.
      - generic [ref=f4e212]:
        - paragraph [ref=f4e213]: Cain framed group planning, Ororo needed neighborhood context, and Selina needed precise filters for shorter trips.
        - paragraph [ref=f4e214]: The graduate-studio project stopped at a concept and did not include an engineering handoff.
        - paragraph [ref=f4e215]:
          - text: The resulting framework was
          - mark [ref=f4e216]: Learn, Plan, Go
          - text: ":"
        - list [ref=f4e217]:
          - listitem [ref=f4e218]:
            - strong [ref=f4e219]: Learn
            - text: surfaces local context.
          - listitem [ref=f4e220]:
            - strong [ref=f4e221]: Plan
            - text: helps users compare and organize.
          - listitem [ref=f4e222]:
            - strong [ref=f4e223]: Go
            - text: converts intent into bookings.
    - region [ref=f4e224]:
      - heading "Rebuilding the concept as a working system" [level=2] [ref=f4e225]
      - generic [ref=f4e226]:
        - paragraph [ref=f4e227]: For this portfolio case study, I rebuilt the Navi visual system as live React components.
        - paragraph [ref=f4e228]: Jost was selected for display typography to echo urban wayfinding cues. Orange became the primary accent to distinguish Navi from the travel platforms in the audit. The portfolio rebuild pairs it with Lato and a 4px spacing system.
        - paragraph [ref=f4e229]:
          - text: The rebuild includes brand primitives, semantic aliases, interactive variants, and a playground for changing component props.
          - link "See the Navi design system" [ref=f4e230]:
            - /url: /work/navi/system
          - text: . Those components are assembled into a working booking flow.
          - link "Open the demo" [ref=f4e231]:
            - /url: /work/navi/demo
          - text: .
