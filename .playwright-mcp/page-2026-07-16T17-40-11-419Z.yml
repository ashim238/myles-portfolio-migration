    - region [ref=f4e133]:
      - 'heading "The concept: a regenerative travel platform for New York City" [level=2] [ref=f4e134]'
      - paragraph [ref=f4e135]: The early design premise treated concentrated tourism as a routing problem.
      - generic [ref=f4e136]:
        - paragraph [ref=f4e137]: That premise came before the resident survey and without a live tourist-density dataset. The first concept explored how redirection might distribute attention across more Manhattan neighborhoods.
        - paragraph [ref=f4e138]: The next concept paired neighborhood-level experiences and local context with trip planning.
    - region [ref=f4e139]:
      - heading "The first idea was a Manhattan heatmap" [level=2] [ref=f4e140]
      - paragraph [ref=f4e141]: A Manhattan heatmap turned the routing premise into an exploratory artifact.
      - generic [ref=f4e142]:
        - paragraph [ref=f4e143]: Before the survey, the team sketched a routing layer that could redirect a visitor from one Manhattan neighborhood to another. It did not claim to measure actual tourist density.
        - paragraph [ref=f4e144]: Select a neighborhood to see how that first artifact worked. Regions represent narrative emphasis, not live geo analytics. The current interactive reconstruction keeps that same constraint.
        - paragraph [ref=f4e145]: Even within the premise, sending someone somewhere quieter left the visit itself unchanged. Before committing to redirection as the lever, the next step was the resident survey.
