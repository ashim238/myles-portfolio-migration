        - generic [ref=f1e95]: Creative Strategist Intern · 2021
      - heading "TikTok Dynamic Showcase Ads" [level=1] [ref=f1e96]
      - paragraph [ref=f1e97]: During my 2021 internship with Global Creative Lab, I designed three static catalog templates for TikTok's Dynamic Showcase Ads. The product slot stayed fixed while the type, color, and supporting graphics changed.
    - region "At a glance" [ref=f1e98]:
      - generic [ref=f1e99]:
        - generic [ref=f1e100]:
          - term [ref=f1e101]: Problem
          - definition [ref=f1e102]: Dynamic Showcase Ads gave brands pre-made catalog templates. GCL needed a launch batch that could cover several fashion subcultures and still look at home on TikTok.
        - generic [ref=f1e103]:
          - term [ref=f1e104]: Role
          - definition [ref=f1e105]: Creative Strategist Intern
        - generic [ref=f1e106]:
          - term [ref=f1e107]: Contribution
          - definition [ref=f1e108]: Designed three of roughly ten templates in TikTok's Dynamic Showcase Ads launch batch.
        - generic [ref=f1e109]:
          - term [ref=f1e110]: Team
          - definition [ref=f1e111]: Global Creative Lab
        - generic [ref=f1e112]:
          - term [ref=f1e113]: Feedback
          - definition [ref=f1e114]: GCL encouraged me to keep exploring the templates as modular parts and pushed each direction closer to TikTok's existing brand language.
        - generic [ref=f1e115]:
          - term [ref=f1e116]: Timeline
          - definition [ref=f1e117]: May – August 2021
        - generic [ref=f1e118]:
          - term [ref=f1e119]: Tools
          - definition [ref=f1e120]: Photoshop, Illustrator
        - generic [ref=f1e121]:
          - term [ref=f1e122]: Outcome
          - definition [ref=f1e123]:
            - generic [ref=f1e124]: "1"
            - text: of 3 templates shipped in the launch library
      - generic [ref=f1e125]:
        - paragraph [ref=f1e126]: Key moves
        - list [ref=f1e127]:
          - listitem [ref=f1e128]: → Studied Y2K, Maximalism, Dark Academia, WitchTok, and Cottagecore before choosing the final directions.
          - listitem [ref=f1e129]: → Used one product slot map across Dopamine Dressing, e-Boy/e-Girl, and Light Academia.
          - listitem [ref=f1e130]: → Built the files in parts and tested which elements could mix across directions.
    - region [ref=f1e131]:
      - heading "Choosing the visual directions" [level=2] [ref=f1e132]
      - paragraph [ref=f1e134]: Before I moved into mockups, I looked at Y2K, Maximalism, Dark Academia, WitchTok, and Cottagecore. Those references helped me compare how different parts of TikTok's fashion community used type, color, texture, and imagery. I moved forward with Dopamine Dressing, e-Boy/e-Girl, and Light Academia because the differences were obvious at a glance.
    - region [ref=f1e135]:
      - heading "The catalog structure stayed fixed" [level=2] [ref=f1e136]
      - paragraph [ref=f1e138]: Brands added their product catalog to a pre-made template. I handed off layered Photoshop files with a slot map showing where each asset would go.
