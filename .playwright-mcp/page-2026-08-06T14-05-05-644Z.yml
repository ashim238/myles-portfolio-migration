        - paragraph [ref=f7e141]: I compared Y2K, Maximalism, Dark Academia, WitchTok, and Cottagecore through their use of type, color, texture, and imagery. Three directions moved forward because they created clearly different visual systems inside the same slot map. Those directions were Dopamine Dressing, e-Boy/e-Girl, and Light Academia.
