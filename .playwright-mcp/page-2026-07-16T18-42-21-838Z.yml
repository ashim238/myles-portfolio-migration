        - generic [ref=f5e95]: Creative Strategist Intern · 2021
      - heading "TikTok Dynamic Showcase Ads" [level=1] [ref=f5e96]
      - paragraph [ref=f5e97]: During my 2021 internship with Global Creative Lab, I designed three static catalog templates for TikTok's Dynamic Showcase Ads. The product slot stayed fixed while the type, color, and supporting graphics changed.
    - region "At a glance" [ref=f5e98]:
      - generic [ref=f5e99]:
        - generic [ref=f5e100]:
          - term [ref=f5e101]: Problem
          - definition [ref=f5e102]: Dynamic Showcase Ads gave brands pre-made catalog templates. GCL needed a launch batch that could cover several fashion subcultures and still look at home on TikTok.
        - generic [ref=f5e103]:
          - term [ref=f5e104]: Role
          - definition [ref=f5e105]: Creative Strategist Intern
        - generic [ref=f5e106]:
          - term [ref=f5e107]: Contribution
          - definition [ref=f5e108]: Designed three of roughly ten templates in TikTok's Dynamic Showcase Ads launch batch.
        - generic [ref=f5e109]:
          - term [ref=f5e110]: Team
          - definition [ref=f5e111]: Global Creative Lab
        - generic [ref=f5e112]:
          - term [ref=f5e113]: Feedback
          - definition [ref=f5e114]: GCL encouraged me to keep exploring the templates as modular parts and pushed each direction closer to TikTok's existing brand language.
        - generic [ref=f5e115]:
          - term [ref=f5e116]: Timeline
          - definition [ref=f5e117]: May – August 2021
        - generic [ref=f5e118]:
          - term [ref=f5e119]: Tools
          - definition [ref=f5e120]: Photoshop, Illustrator
        - generic [ref=f5e121]:
