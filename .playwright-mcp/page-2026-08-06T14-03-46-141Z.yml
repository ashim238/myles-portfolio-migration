            - generic [ref=f3e315]:
              - paragraph [ref=f3e316]: The graduate-studio project ended as a Figma concept. Later, working alone, I rebuilt the concept by turning Learn, Plan, Go into a React and TypeScript component system and a working individual booking flow.
              - paragraph [ref=f3e317]: Jost was selected for display typography to echo urban wayfinding cues. Orange became the primary accent to distinguish Navi from the travel platforms in the audit. The palette pairs it with Lato and a 4px spacing system.
              - paragraph [ref=f3e318]:
                - text: The portfolio rebuild includes brand primitives, semantic aliases, interactive variants, and a playground for changing component props.
