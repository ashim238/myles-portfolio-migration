              - paragraph [ref=f3e188]: I created three research-informed archetypes from the survey, platform audits, and secondary research.
              - paragraph [ref=f3e189]: The graduate-studio project ended as a concept without an engineering handoff, so the journey maps and user flows remained internal planning artifacts.
              - paragraph [ref=f3e190]: I used the archetypes, journey map, opportunity areas, and flows to connect the survey findings with neighborhood exploration.
              - paragraph [ref=f3e191]: The Airbnb audit and secondary research shaped the individual booking flow. Cost, requirements, and timing stayed visible at key decisions, especially when a lesser-known vendor needed to earn trust.
