    - region [ref=f1e170]:
      - heading "Building the templates in parts" [level=2] [ref=f1e171]
      - generic [ref=f1e172]:
        - paragraph [ref=f1e173]: I built each template in parts so the catalog content could drop into a fixed structure. While working that way, I started to see the individual pieces as a system brands could potentially customize rather than a single locked composition.
        - paragraph [ref=f1e174]: "I pitched that direction while I was constructing the files, and GCL encouraged me to keep exploring it. Most combinations worked best inside their own visual system. Light Academia and #e-Boy/#e-Girl shared enough structure that I could borrow some parts between them."
    - region [ref=f1e175]:
