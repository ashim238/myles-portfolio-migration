      - heading "TikTok Dynamic Showcase Ads" [level=1] [ref=f1e96]
      - paragraph [ref=f1e97]: During my 2021 internship with Global Creative Lab, I designed three static templates for TikTok's Dynamic Showcase Ads. Each gave a different fashion subculture its own visual language while keeping the same catalog structure.
    - region "At a glance" [ref=f1e98]:
      - generic [ref=f1e99]:
        - generic [ref=f1e100]:
          - term [ref=f1e101]: Problem
          - definition [ref=f1e102]: Pre-made catalog templates needed enough visual range to speak to different fashion tastes without losing TikTok's identity.
        - generic [ref=f1e103]:
          - term [ref=f1e104]: Role
          - definition [ref=f1e105]: Creative Strategist Intern
        - generic [ref=f1e106]:
          - term [ref=f1e107]: Contribution
