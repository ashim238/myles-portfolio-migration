      - heading "TikTok Dynamic Showcase Ads" [level=1] [ref=f3e83]
      - paragraph [ref=f3e84]: During my 2021 internship with Global Creative Lab, I designed three static templates for TikTok's Dynamic Showcase Ads. Each gave a different fashion subculture its own visual language while keeping the same catalog structure.
    - region "At a glance" [ref=f3e85]:
      - generic [ref=f3e86]:
        - generic [ref=f3e87]:
          - term [ref=f3e88]: Problem
          - definition [ref=f3e89]: Pre-made catalog templates needed enough visual range to speak to different fashion tastes without losing TikTok's identity.
        - generic [ref=f3e90]:
