    - region [ref=f3e118]:
      - heading "From five references to three templates" [level=2] [ref=f3e119]
      - paragraph [ref=f3e121]: Before I moved into mockups, I looked at Y2K, Maximalism, Dark Academia, WitchTok, and Cottagecore. I narrowed those references to three directions that felt different enough to appeal to different tastes without losing TikTok's identity.
    - region [ref=f3e122]:
      - heading "One catalog structure. Three templates." [level=2] [ref=f3e123]
      - paragraph [ref=f3e125]: Brands added their product catalog to a pre-made template. I handed off layered Photoshop files with a slot map showing where each asset would go.
