              - heading "Myles Ashitey" [level=1] [ref=f3e39]
              - generic [ref=f3e40]:
                - paragraph [ref=f3e41]: I came to product design through creative strategy at TikTok and Universal Music Group. I learned how brands talk to people, then realized I wanted to build rather than just shape. That led me to an MFA in Design and Technology at Parsons, which I completed in 2026.
                - paragraph [ref=f3e42]: My thesis became Fresh Greens, a React Native wayfinding prototype for Black drivers. For UnderstandingFAFSA, I built reusable newsletter templates. The first redesigned send had an observed 52.6% open rate with Mailchimp Privacy Protection excluded. At TikTok, I designed three catalog templates. One entered the launch library and was later selected by American Eagle.
                - paragraph [ref=f3e43]: Outside of work, I'm a huge comic fan. The work Daniel Mora's been doing on World's Finest is “chef's kiss.” I've also been trying to hike more, as much as the city and my allergies allow. If you want to talk product design, RPGs, or a bit of both, my email is below.
