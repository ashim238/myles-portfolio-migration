      - heading "TikTok Dynamic Showcase Ads" [level=1] [ref=f22e97]
      - paragraph [ref=f22e98]: During my 2021 internship with Global Creative Lab, I designed three static catalog templates for TikTok's Dynamic Showcase Ads. The product slot stayed fixed while the type, color, and supporting graphics changed.
    - region "At a glance" [ref=f22e99]:
      - generic [ref=f22e100]:
        - generic [ref=f22e101]:
          - term [ref=f22e102]: Problem
          - definition [ref=f22e103]: Dynamic Showcase Ads gave brands pre-made catalog templates. GCL needed a launch batch that could cover several fashion subcultures and still look at home on TikTok.
        - generic [ref=f22e104]:
          - term [ref=f22e105]: Role
          - definition [ref=f22e106]: Creative Strategist Intern
        - generic [ref=f22e107]:
          - term [ref=f22e108]: Contribution
          - definition [ref=f22e109]: Designed three of roughly ten templates in TikTok's Dynamic Showcase Ads launch batch.
        - generic [ref=f22e110]:
          - term [ref=f22e111]: Team
          - definition [ref=f22e112]: Global Creative Lab
        - generic [ref=f22e113]:
          - term [ref=f22e114]: Feedback
          - definition [ref=f22e115]: GCL encouraged me to keep exploring the templates as modular parts and pushed each direction closer to TikTok's existing brand language.
        - generic [ref=f22e116]:
          - term [ref=f22e117]: Timeline
          - definition [ref=f22e118]: May – August 2021
        - generic [ref=f22e119]:
          - term [ref=f22e120]: Tools
          - definition [ref=f22e121]: Photoshop, Illustrator
