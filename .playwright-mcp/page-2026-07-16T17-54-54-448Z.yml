      - generic [ref=f1e99]:
        - generic [ref=f1e100]:
          - term [ref=f1e101]: Problem
          - definition [ref=f1e102]: Dynamic Showcase Ads gave brands pre-made catalog templates. GCL needed a launch batch that could cover several fashion subcultures and still look at home on TikTok.
        - generic [ref=f1e103]:
          - term [ref=f1e104]: Role
          - definition [ref=f1e105]: Creative Strategist Intern
        - generic [ref=f1e106]:
          - term [ref=f1e107]: Contribution
          - definition [ref=f1e108]: Designed three of roughly ten templates in TikTok's Dynamic Showcase Ads launch batch.
        - generic [ref=f1e109]:
          - term [ref=f1e110]: Team
          - definition [ref=f1e111]: Global Creative Lab
        - generic [ref=f1e112]:
          - term [ref=f1e113]: Feedback
          - definition [ref=f1e114]: GCL encouraged me to keep exploring the templates as modular parts and pushed each direction closer to TikTok's existing brand language.
        - generic [ref=f1e115]:
          - term [ref=f1e116]: Timeline
          - definition [ref=f1e117]: May – August 2021
        - generic [ref=f1e118]:
