    - region [ref=f3e197]:
      - heading "Templates as modular parts" [level=2] [ref=f3e198]
      - generic [ref=f3e199]:
        - paragraph [ref=f3e200]: I built each template in parts so the catalog content could drop into a fixed structure. While working that way, I started to see the individual pieces as a system brands could potentially customize rather than a single locked composition.
        - paragraph [ref=f3e201]: "I pitched that direction while I was constructing the files, and GCL encouraged me to keep exploring it. Most combinations worked best inside their own visual system. Light Academia and #e-Boy/#e-Girl shared enough structure that I could borrow some parts between them."
