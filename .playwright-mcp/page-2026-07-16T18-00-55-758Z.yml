        - generic [ref=f3e95]: Creative Strategist Intern · 2021
      - heading "TikTok Dynamic Showcase Ads" [level=1] [ref=f3e96]
      - paragraph [ref=f3e97]: During my 2021 internship with Global Creative Lab, I designed three static catalog templates for TikTok's Dynamic Showcase Ads. The product slot stayed fixed while the type, color, and supporting graphics changed.
    - region "At a glance" [ref=f3e98]:
      - generic [ref=f3e99]:
        - generic [ref=f3e100]:
          - term [ref=f3e101]: Problem
          - definition [ref=f3e102]: Dynamic Showcase Ads gave brands pre-made catalog templates. GCL needed a launch batch that could cover several fashion subcultures and still look at home on TikTok.
        - generic [ref=f3e103]:
          - term [ref=f3e104]: Role
          - definition [ref=f3e105]: Creative Strategist Intern
        - generic [ref=f3e106]:
          - term [ref=f3e107]: Contribution
          - definition [ref=f3e108]: Designed three of roughly ten templates in TikTok's Dynamic Showcase Ads launch batch.
        - generic [ref=f3e109]:
          - term [ref=f3e110]: Team
          - definition [ref=f3e111]: Global Creative Lab
        - generic [ref=f3e112]:
          - term [ref=f3e113]: Feedback
          - definition [ref=f3e114]: GCL encouraged me to keep exploring the templates as modular parts and pushed each direction closer to TikTok's existing brand language.
        - generic [ref=f3e115]:
          - term [ref=f3e116]: Timeline
          - definition [ref=f3e117]: May – August 2021
        - generic [ref=f3e118]:
          - term [ref=f3e119]: Tools
          - definition [ref=f3e120]: Photoshop, Illustrator
