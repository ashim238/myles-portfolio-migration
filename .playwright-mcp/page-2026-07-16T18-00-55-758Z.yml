    - region [ref=f3e160]:
      - heading "Fashion subcultures on TikTok" [level=2] [ref=f3e161]
      - paragraph [ref=f3e163]: Before I moved into mockups, I looked at Y2K, Maximalism, Dark Academia, WitchTok, and Cottagecore. Those references helped me compare how different parts of TikTok's fashion community used type, color, texture, and imagery. I moved forward with Dopamine Dressing, e-Boy/e-Girl, and Light Academia because the differences were obvious at a glance.
    - region [ref=f3e164]:
      - heading "Defining the fixed catalog structure" [level=2] [ref=f3e165]
      - paragraph [ref=f3e167]: Brands added their product catalog to a pre-made template. I handed off layered Photoshop files with a slot map showing where each asset would go.
