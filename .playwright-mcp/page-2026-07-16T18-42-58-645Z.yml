    - region [ref=f6e424]:
      - heading "Rebuilding the system in Mailchimp" [level=2] [ref=f6e425]
      - generic [ref=f6e426]:
        - paragraph [ref=f6e427]: The hierarchy, spacing, and modular rhythm all lived in Figma, but the live template had to be rebuilt in Mailchimp so the founder could edit without touching HTML. Matching Figma spacing inside the builder was a dead end. Every container and wrapper added bloat. I simplified the section-header and body hierarchy for the Mailchimp build.
        - paragraph [ref=f6e428]:
          - mark [ref=f6e429]: Gmail's 102KB HTML ceiling and clipping created a rigid constraint.
          - text: Early weight came from custom section icons and themed dividers exported from Figma. Test sends showed which wrappers and dividers could go. I merged sections where they still scanned and compressed PNGs through an external tool. For dark-mode-friendly dividers, I removed backgrounds in Photoshop so assets stayed lighter without muddying on phone.
        - paragraph [ref=f6e430]: "Compression wasn't one recipe. The weekly kit leaned on fewer custom assets and more Mailchimp-native structure. The counselor toolkit needed more image work and tighter file discipline for its duotone icons. What I wouldn't trade for a few kilobytes: typography tuned to the closest Mailchimp sans to the site's Saans typeface, and the full brand palette, even when trying to maintain the founder's appetite for vibrancy."
      - generic [ref=f6e431]:
        - 'figure "Figma: students block (design source)" [ref=f6e432]':
          - 'button "Expand image: Figma: students block with layout guides, spacing rails, and type hierarchy." [ref=f6e433]':
            - 'img "Figma: students block with layout guides, spacing rails, and type hierarchy." [ref=f6e434]'
        - 'figure "Mailchimp: students block (shipped module)" [ref=f6e436]':
          - 'button "Expand image: Mailchimp: same students block after translation into editable modules." [ref=f6e437]':
            - 'img "Mailchimp: same students block after translation into editable modules." [ref=f6e438]'
    - region [ref=f6e440]:
