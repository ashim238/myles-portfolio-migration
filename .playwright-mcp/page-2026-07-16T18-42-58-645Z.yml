          - mark [ref=f6e444]: This was my first time designing a system someone else assembles every week.
        - paragraph [ref=f6e445]: "The first redesigned send went out November 4, 2025. Mailchimp reported ~52.6% for the first redesigned send with MPP excluded. Earlier sends opened around 30%. What shipped: a master template, modular blocks, explicit locked-vs-swappable rules, and three template variants on the same design vocabulary."
