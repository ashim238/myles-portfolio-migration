    - region [ref=f6e152]:
      - heading "A rebrand and a weekly workflow" [level=2] [ref=f6e153]
      - paragraph [ref=f6e155]: UnderstandingFAFSA helps students, parents, and counselors navigate the Free Application for Federal Student Aid (FAFSA). The newsletter carries guidance for all three groups. The website had already adopted Saans and a refreshed palette. The scope was email-only, and the founder assembles every issue.
    - region [ref=f6e156]:
      - heading "Where the old template broke down" [level=2] [ref=f6e157]
      - paragraph [ref=f6e159]: "The newsletter covers deadline-driven guidance at key checkpoints: FAFSA filing windows, scholarship deadlines, and policy changes. The old template had uneven CTAs, long stretches of text, weak section breaks, and a layout that wasn't optimized for mobile. Its muted palette also came from the site's previous visual system."
      - generic "Newsletter mobile layouts and reported open rates" [ref=f6e160]:
        - figure "Prior sends · around 30% open rate" [ref=f6e161]:
          - 'button "Expand image: Old newsletter template on mobile before the redesign, full scroll." [ref=f6e166]':
            - img "Old newsletter template on mobile before the redesign, full scroll." [ref=f6e167]
        - figure "First redesigned send · ~52.6% open rate (MPP excluded)" [ref=f6e169]:
          - 'button "Expand image: Redesigned newsletter on mobile with updated hierarchy and brand system, full scroll." [ref=f6e174]':
            - img "Redesigned newsletter on mobile with updated hierarchy and brand system, full scroll." [ref=f6e175]
    - region [ref=f6e177]:
      - heading "What 120 newsletters revealed" [level=2] [ref=f6e178]
      - generic [ref=f6e179]:
        - paragraph [ref=f6e180]: "Before touching templates, I worked with one collaborator to compile over 120 newsletter examples and evaluate them against four criteria: clarity, personalization, tone of voice, and visual appeal and branding consistency."
        - paragraph [ref=f6e181]: "Five newsletters got the deepest treatment: Revenews, The 74, Next by Jeff Selingo, Medium, and Folderly. Each used a different mix of structure, tone, and branding."
        - paragraph [ref=f6e182]: The rest of the newsletter pool served as lighter references for layout, color, and hierarchy patterns.
        - paragraph [ref=f6e183]: "The deep dive highlights:"
        - list [ref=f6e184]:
          - listitem [ref=f6e185]:
            - text: Revenews used
            - strong [ref=f6e186]: selective bolding
            - text: ", emoji section headers, and concise intros."
          - listitem [ref=f6e187]:
            - text: Folderly carried
            - strong [ref=f6e188]: brand color
            - text: into its bullet styles.
          - listitem [ref=f6e189]:
            - text: Several references used
            - strong [ref=f6e190]: action-focused section titles
            - text: to divide long sends.
          - listitem [ref=f6e191]:
            - text: The 74 used a
            - strong [ref=f6e192]: more formal register
            - text: than student-facing references that used emojis and GIFs.
          - listitem [ref=f6e193]:
            - text: Next used
            - strong [ref=f6e194]: if/then link framing
            - text: ", author photos, and brief bios."
    - region [ref=f6e195]:
      - heading "Three send types from the audit" [level=2] [ref=f6e196]
      - generic [ref=f6e197]:
        - paragraph [ref=f6e198]: The shared framework includes a welcome email that sets expectations, the core weekly newsletter, and an event-specific variant with fewer blocks for invites and recaps. A counselor-focused toolkit extends the same vocabulary (duotone icons, formal register) and is in progress.
        - paragraph [ref=f6e199]: The welcome email follows a deliberate structure shaped by the audit. It includes a banner, gratitude, what to expect, a brief history that transitions into the current mission, a CTA, suggested reading, and social links. The welcome email introduces the redesigned type, palette, and content structure.
