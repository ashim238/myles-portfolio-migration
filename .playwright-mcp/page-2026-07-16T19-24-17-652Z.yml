        - generic [ref=f16e96]: Creative Strategist Intern · 2021
      - heading "TikTok Dynamic Showcase Ads" [level=1] [ref=f16e97]
      - paragraph [ref=f16e98]: During my 2021 internship with Global Creative Lab, I designed three static catalog templates for TikTok's Dynamic Showcase Ads. The product slot stayed fixed while the type, color, and supporting graphics changed.
    - region "At a glance" [ref=f16e99]:
      - generic [ref=f16e100]:
        - generic [ref=f16e101]:
          - term [ref=f16e102]: Problem
          - definition [ref=f16e103]: Dynamic Showcase Ads gave brands pre-made catalog templates. GCL needed a launch batch that could cover several fashion subcultures and still look at home on TikTok.
        - generic [ref=f16e104]:
          - term [ref=f16e105]: Role
          - definition [ref=f16e106]: Creative Strategist Intern
        - generic [ref=f16e107]:
          - term [ref=f16e108]: Contribution
          - definition [ref=f16e109]: Designed three of roughly ten templates in TikTok's Dynamic Showcase Ads launch batch.
        - generic [ref=f16e110]:
          - term [ref=f16e111]: Team
          - definition [ref=f16e112]: Global Creative Lab
        - generic [ref=f16e113]:
          - term [ref=f16e114]: Feedback
          - definition [ref=f16e115]: GCL encouraged me to keep exploring the templates as modular parts and pushed each direction closer to TikTok's existing brand language.
        - generic [ref=f16e116]:
          - term [ref=f16e117]: Timeline
          - definition [ref=f16e118]: May – August 2021
        - generic [ref=f16e119]:
